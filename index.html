        var text = (event.target && event.target.closest ? (event.target.closest('button, a, [role="menuitem"]') || event.target).textContent || '' : '').replace(/\s+/g, ' ').trim();

        't2b_low_good': 'T2B (1 ดี)',

          }
          return buf;
        };
      }

      async function _restoreTBSettingFromBuffer(buf, filename) {
        try {
          var ExcelJS = await _getExcelJS();
          if (!ExcelJS) return;
          var wb = new ExcelJS.Workbook();
          await wb.xlsx.load(buf);
          var ws = wb.worksheets.find(function (w) { return w.name === 'TB_Setting'; });
          var revLabels = {};
          Object.keys(presetLabels).forEach(function (k) { revLabels[presetLabels[k]] = k; });
          var newStore = {};
          if (ws) {
            for (var r = 2; r <= ws.rowCount; r++) {
              var vCell = ws.getCell(r, 1);
              var sCell = ws.getCell(r, 2);
              if (!vCell || !sCell) continue;
              var vName = vCell.value && vCell.value.richText ? vCell.value.richText.map(function (x) { return x.text; }).join('') : String(vCell.value || '');

              if (vName && setting && vName !== 'Variable') {
                var presetId = revLabels[setting] || setting;
                newStore[vName] = { preset: presetId };
              }
            }
            console.log('[TB_Setting] Loaded from', filename, '-> mapped presets:', newStore);
          } else {
            console.log('[TB_Setting] File read from', filename, '— no TB_Setting sheet (checking Output for Sig).');
          }

      function insertVarToken(textarea, varName) {

        var left = textarea.value.slice(0, start);
        var right = textarea.value.slice(end);
        var needLeft = left.length > 0 && !/\s|\(|&|\||!|=|<|>$/.test(left);
        var needRight = right.length > 0 && !/^\s|\)|&|\||!|=|<|>/.test(right);
        var token = (needLeft ? ' ' : '') + varName + (needRight ? ' ' : '');
        textarea.value = left + token + right;
        var caret = left.length + token.length;
        textarea.selectionStart = textarea.selectionEnd = caret;
      }

  <!-- Script 4 — Fix: SIDE/TOP move up/down reorder for add-mode (single-item branches) -->
  <script>
    (function () {
      var AXIS2 = '__AXIS2__:';
      var LJ = ' || ';
      var AJ = ' ++ ';

      function fiberOf(el) {
        var k = Object.keys(el).find(function (k) { return k.startsWith('__reactFiber'); });
        return k ? el[k] : null;
      }

      function dedupe(branches) {
        var seen = {};
        var result = [];
        branches.forEach(function (b) {
          var clean = b.filter(Boolean);
          if (clean.length === 0) return;
          var key = clean.join('\x1f');
          if (seen[key]) return;
          seen[key] = true;
          result.push(clean);
        });
        return result;
      }

      function parseAxis(str) {
        if (!str) return [];
        var s = str.trim();
        if (s.indexOf(AXIS2) === 0) {
          try {
            var arr = JSON.parse(s.slice(AXIS2.length));
            if (!Array.isArray(arr)) return [];
            return dedupe(arr.filter(Array.isArray).map(function (b) {
              return b.map(function (v) { return String(v).trim(); }).filter(Boolean);
            }));
          } catch (e) { return []; }
        }
        var levels = s.split(LJ).map(function (lvl) {
          var t = lvl.trim();
          if (!t) return [];
          return t.indexOf(AJ) >= 0
            ? t.split(AJ).map(function (v) { return v.trim() }).filter(Boolean)
            : [t];
        }).filter(function (l) { return l.length > 0 });
        var branches = [[]];
        levels.forEach(function (level) {
          var next = [];
          branches.forEach(function (branch) {
            level.forEach(function (item) { next.push(branch.concat([item])); });
          });
          branches = next;
        });
        return dedupe(branches);
      }

      function tryJoinLegacy(branches) {
        if (branches.length === 0) return null;
        var maxLen = Math.max.apply(null, branches.map(function (b) { return b.length }));
        var levels = [];
        for (var i = 0; i < maxLen; i++) {
          var items = []; var seen = {};
          branches.forEach(function (b) {
            var v = b[i];
            if (v && !seen[v]) { seen[v] = true; items.push(v); }
          });
          if (items.length === 0) return null;
          levels.push(items);
        }
        var cart = [[]];
        levels.forEach(function (level) {
          var next = [];
          cart.forEach(function (branch) {
            level.forEach(function (item) { next.push(branch.concat([item])); });
          });
          cart = next;
        });
        if (cart.length !== branches.length) return null;
        var bSet = new Set(branches.map(function (b) { return b.join('\x1f') }));
        var cSet = new Set(cart.map(function (b) { return b.join('\x1f') }));
        if (bSet.size !== cSet.size) return null;
        for (var v of cSet) { if (!bSet.has(v)) return null; }
        return levels.map(function (l) { return l.join(AJ) }).join(LJ);
      }

      function joinAxis(branches) {
        var d = dedupe(branches);
        if (d.length === 0) return null;
        var legacy = tryJoinLegacy(d);
        return legacy !== null ? legacy : AXIS2 + JSON.stringify(d);
      }

      function moveVar(branches, name, direction) {
        var d = dedupe(branches);
        var matches = [];
        d.forEach(function (b, bi) {
          var ii = b.indexOf(name);
          if (ii >= 0) matches.push({ branchIndex: bi, itemIndex: ii });
        });
        if (matches.length === 0) return branches;

        /* Add mode: each branch has exactly 1 item → swap whole branches */
        var allSingle = d.every(function (b) { return b.length === 1 });
        if (allSingle && matches.length === 1 && d.length > 1) {
          var pos = matches[0].branchIndex;
          var nb = pos + direction;
          if (nb < 0 || nb >= d.length) return branches;
          var next = d.map(function (b) { return b.slice() });
          var tmp = next[pos]; next[pos] = next[nb]; next[nb] = tmp;
          return dedupe(next);
        }

        /* Nest mode: swap within branch */
        return dedupe(d.map(function (branch, bi) {
          var m = matches.find(function (x) { return x.branchIndex === bi });
          if (!m) return branch;
          var ti = m.itemIndex + direction;
          if (ti < 0 || ti >= branch.length) return branch;
          var n = branch.slice();
          var t2 = n[m.itemIndex]; n[m.itemIndex] = n[ti]; n[ti] = t2;
          return n;
        }));
      }

      /* Walk UP fiber tree (same proven pattern as Script 1 dispatchTables) */
      function dispatchTablesFix(startFiber, updaterFn) {
        var f = startFiber;
        while (f) {
          var s = f.memoizedState;
          while (s) {
            var v = s.memoizedState;
            if (Array.isArray(v) && v.length > 0 && v[0] &&
              typeof v[0].id === 'string' && 'colVar' in v[0] && 'rowVar' in v[0]) {
              s.queue.dispatch(updaterFn);
              return true;
            }
            s = s.next;
          }
          f = f.return;
        }
        return false;
      }

      function findTableId(fiber) {
        var f = fiber;
        while (f) {
          var p = f.memoizedProps;
          if (p && p.table && typeof p.table.id === 'string' && 'colVar' in p.table)
            return p.table.id;
          f = f.return;
        }
        return null;
      }

      function getAxis(btn) {
        var el = btn;
        while (el && el !== document.body) {
          if (el.querySelector) {
            var lbl = el.querySelector('.font-bold.uppercase');
            if (lbl) {
              var t = (lbl.textContent || '').trim().toUpperCase();
              if (t === 'SIDE') return 'row';
              if (t === 'TOP') return 'col';
            }
          }
          el = el.parentElement;
        }
        return null;
      }

      function getVarName(btn) {
        var item = btn;
        while (item && item !== document.body) {
          if (item.getAttribute && item.getAttribute('draggable') === 'true') break;
          item = item.parentElement;
        }
        if (!item || item === document.body) return null;
        var nm = item.querySelector('.font-semibold');
        return nm ? nm.textContent.trim() : null;
      }

      function findMoveButton(el) {
        var t = el;
        while (t && t !== document.body) {
          if (t.tagName === 'BUTTON' && (t.title === 'Move up' || t.title === 'Move down')) return t;
          if (t.nodeName && t.nodeName.toLowerCase() === 'button' && (t.title === 'Move up' || t.title === 'Move down')) return t;
          t = t.parentElement || t.parentNode;
        }
        return null;
      }

      /* Capture click on document — fires BEFORE React's delegated handler on #root.
         Dispatch our fix first; React's handler fires after and is a harmless no-op
         (Fl can't swap within single-item branches, so the state stays the same). */
      document.addEventListener('click', function (e) {
        var btn = findMoveButton(e.target);
        if (!btn) return;
        if (!window.__cxSettingsWorkbookLinked && typeof window.__cxRequireSettingsWorkbook === 'function') {
          e.preventDefault();
          e.stopImmediatePropagation();
          window.__cxRequireSettingsWorkbook('แก้ไขลำดับตัวแปรใน TOP / SIDE', function () {
            try { btn.click(); } catch (err) { }
          });
          return;
        }

        var axis = getAxis(btn);
        if (!axis) return;
        var varName = getVarName(btn);
        if (!varName) return;
        var dir = btn.title === 'Move up' ? -1 : 1;
        var field = axis === 'row' ? 'rowVar' : 'colVar';

        var fiber = fiberOf(btn);
        if (!fiber) return;

        var tableId = findTableId(fiber);
        if (!tableId) return;

        dispatchTablesFix(fiber, function (prev) {
          return prev.map(function (t) {
            if (t.id !== tableId) return t;
            var branches = parseAxis(t[field]);
            var allSingle = branches.every(function (b) { return b.length === 1; });
            if (!allSingle || branches.length < 2) return t;
            var moved = moveVar(branches, varName, dir);
            var newVal = joinAxis(moved);
            if (newVal === t[field]) return t;
            var updated = {};
            for (var k in t) updated[k] = t[k];
            updated[field] = newVal;
            updated.result = null;
            return updated;
          });
        });
        if (window.__cxSettingsWorkbookLinked) {
          setTimeout(function () {
            var run = function () {
              if (typeof window.cxCloudAutosaveSettingsNow === 'function') window.cxCloudAutosaveSettingsNow();
              else if (typeof window.cxTriggerWorkspaceSave === 'function') window.cxTriggerWorkspaceSave();
            };
            if (typeof window.requestIdleCallback === 'function') window.requestIdleCallback(run, { timeout: 5000 });
            else setTimeout(run, 0);
          }, 1800);
        }
      }, true);
    })();
  </script>

  <!-- Script 5 — Test Sig: Significance Testing for Crosstab columns -->
  <script>
    (function () {
      'use strict';
      if (window.__cxTestSig) return;
      window.__cxTestSig = true;

      /* ── Sig Settings (persisted in settings workbook) ── */
      function loadSigSettings() {
        return window.__cxLoadSigSettings ? window.__cxLoadSigSettings() : { enabled: false, level: 95, sigLetters: '' };
      }
      function saveSigSettings(s) {
        if (window.__cxSaveSigSettings) window.__cxSaveSigSettings(s);
      }

      /* ── Z critical values ── */
      function zCrit(level) {
        return level === 90 ? 1.6449 : level === 99 ? 2.5758 : 1.96;
      }

      /* ── Column proportion z-test ── */
      function computeSigLetters(counts, colBases, sigLevel, letterMap, minBase, groupOf) {
        var nRows = counts.length;
        var nCols = colBases.length;
        var zc = zCrit(sigLevel);
        var minB = Math.max(2, Math.floor(Number(minBase) || 0));
        var result = [];
        for (var ri = 0; ri < nRows; ri++) {
          var row = [];
          for (var ci = 0; ci < nCols; ci++) row.push([]);
          result.push(row);
        }
        for (var ri = 0; ri < nRows; ri++) {
          for (var ci = 0; ci < nCols; ci++) {
            var ni = colBases[ci];
            if (ni < minB) continue;
            var countI = (counts[ri] && counts[ri][ci]) || 0;
            var pi = countI / ni;
            for (var cj = 0; cj < nCols; cj++) {
              if (ci === cj) continue;
              if (groupOf && groupOf[ci] !== groupOf[cj]) continue; /* only compare within the same letter group */
              var nj = colBases[cj];
              if (nj < minB) continue;
              var countJ = (counts[ri] && counts[ri][cj]) || 0;
              var pPooled = (countI + countJ) / (ni + nj);
              if (pPooled <= 0 || pPooled >= 1) continue;
              var se = Math.sqrt(pPooled * (1 - pPooled) * (1 / ni + 1 / nj));
              if (se <= 0) continue;
              var z = (pi - countJ / nj) / se;
              if (z > zc) {
                var letter = letterMap[cj];
                if (letter) result[ri][ci].push(letter);
              }
            }
          }
        }
        return result;
      }

      /* ── Parse letter groups ── */
      /* Returns null if sigLettersStr is empty (user must provide letters) */
      function parseLetterMap(sigLettersStr, nCols) {
        if (!sigLettersStr || !sigLettersStr.trim()) return null;
        var groups = sigLettersStr.split(',').map(function (g) { return g.trim(); });
        var map = {};
        var idx = 0;
        for (var g = 0; g < groups.length; g++) {
          for (var c = 0; c < groups[g].length; c++) {
            if (idx < nCols) { map[idx] = groups[g][c]; idx++; }
          }
        }
        while (idx < nCols) { map[idx] = String.fromCharCode(65 + (idx % 26)); idx++; }
        return map;
      }

      /* Comma-separated letter blocks define COMPARISON GROUPS (e.g. "A,BCD,EF" → A alone,
         B/C/D compared among themselves, E/F among themselves). Returns groupOf[colIndex]. */
      function parseLetterGroups(sigLettersStr, nCols) {
        if (!sigLettersStr || !sigLettersStr.trim()) return null;
        var groups = sigLettersStr.split(',').map(function (g) { return g.trim(); });
        var groupOf = [];
        var idx = 0;
        for (var g = 0; g < groups.length; g++) {
          for (var c = 0; c < groups[g].length; c++) {
            if (idx < nCols) { groupOf[idx] = g; idx++; }
          }
        }
        while (idx < nCols) { groupOf[idx] = 100000 + idx; idx++; } /* unmatched cols: own group (no comparison) */
        return groupOf;
      }

      /* ── Fiber helper ── */
      function fiberOf(el) {
        var k = Object.keys(el).find(function (k) { return k.startsWith('__reactFiber'); });
        return k ? el[k] : null;
      }

      /* ── Inject UI into Output Options dropdown ── */
      function findOutputOptionsPanel() {
        var panels = document.querySelectorAll('div.absolute.right-0');
        for (var i = 0; i < panels.length; i++) {
          var p = panels[i];
          if (p.querySelector && p.textContent && p.textContent.indexOf('Output Options') !== -1 && p.textContent.indexOf('ใช้กับทุก Table') !== -1) {
            return p;
          }
        }
        return null;
      }

      function createSigUI(panel) {
        var settings = loadSigSettings();
        var container = document.createElement('div');
        container.className = 'cx-sig-options';
        container.style.cssText = 'margin-top:12px; padding-top:12px; border-top:1px solid #e5e7eb;';

        container.innerHTML =
          '<p style="font-size:11px;font-weight:700;color:#374151;margin-bottom:8px;">Test Significance</p>' +
          '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">' +
          '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;">' +
          '<input type="checkbox" id="__cx_sig_enabled" style="width:16px;height:16px;accent-color:#1F4E78;" ' + (settings.enabled ? 'checked' : '') + '>' +
          '<span style="font-size:13px;color:#374151;">เปิด Sig Test</span>' +
          '</label>' +
          '</div>' +
          '<div id="__cx_sig_detail" style="' + (settings.enabled ? '' : 'display:none;') + '">' +
          '<div style="display:flex;gap:12px;margin-bottom:8px;">' +
          '<label style="display:flex;align-items:center;gap:4px;cursor:pointer;">' +
          '<input type="radio" name="__cx_sig_level" value="90" style="width:14px;height:14px;accent-color:#1F4E78;" ' + (settings.level === 90 ? 'checked' : '') + '>' +
          '<span style="font-size:12px;color:#374151;">90%</span>' +
          '</label>' +
          '<label style="display:flex;align-items:center;gap:4px;cursor:pointer;">' +
          '<input type="radio" name="__cx_sig_level" value="95" style="width:14px;height:14px;accent-color:#1F4E78;" ' + (settings.level === 95 ? 'checked' : '') + '>' +
          '<span style="font-size:12px;color:#374151;">95%</span>' +
          '</label>' +

                var isMeanRow = (origFont.color && origFont.color.argb && origFont.color.argb.indexOf('C00000') !== -1);

          var detail = await response.text().catch(function () { return ''; });
          if (/<!doctype html|<html/i.test(detail)) {
            detail = 'Cloud returned an HTML error page. The request may be too large or the cloud endpoint is unavailable.';
          }
          throw new Error(detail || ('Cloud request failed: ' + response.status));
        }
        if (response.status === 204) return null;
        var text = await response.text();
        if (/<!doctype html|<html/i.test(text)) {
          throw new Error('Cloud returned an HTML error page instead of JSON.');
        }
        return text ? JSON.parse(text) : null;
      }

      function cxSetCloudSession(session, remember) {
        if (!session || !session.access_token) return;
        cxClearCloudSession(false);
        var storage = remember ? localStorage : sessionStorage;
        storage.setItem(CX_TOKEN_KEY, session.access_token);
        if (session.refresh_token) storage.setItem(CX_REFRESH_KEY, session.refresh_token);
        localStorage.setItem(CX_REMEMBER_KEY, remember ? '1' : '0');
      }

      async function cxRefreshCloudSession() {
        var refreshToken = cxCloudRefreshTokenValue();
        if (!refreshToken) return false;
        var remember = localStorage.getItem(CX_REMEMBER_KEY) !== '0';
        var response = await fetch(CX_SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
          method: 'POST',
          headers: { apikey: CX_SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: refreshToken })
        });
        if (!response.ok) return false;
        var session = await response.json();
        cxSetCloudSession(session, remember);
        return true;
      }

      async function cxCloudGetUser() {
        if (!cxCloudToken()) return null;
        try {
          return await cxCloudFetch('/auth/v1/user', { method: 'GET' });
        } catch (error) {
          if (await cxRefreshCloudSession()) {
            return cxCloudFetch('/auth/v1/user', { method: 'GET' });
          }
          throw error;
        }
      }

      function cxClearCloudSession(clearWorkspace) {
        localStorage.removeItem(CX_TOKEN_KEY);
        localStorage.removeItem(CX_REFRESH_KEY);
        sessionStorage.removeItem(CX_TOKEN_KEY);
        sessionStorage.removeItem(CX_REFRESH_KEY);
        if (clearWorkspace !== false) {
          localStorage.removeItem(CX_WORKSPACE_KEY);
          localStorage.setItem(CX_AUTOSAVE_KEY, 'on');
        }
      }

      async function cxUpdateRecoveryPassword(password) {
        await cxCloudFetch('/auth/v1/user', {
          method: 'PUT',
          body: JSON.stringify({ password: password })
        });
        cxPasswordRecoveryActive = false;

      async function cxCloudSignInPassword(email, password, remember) {
        var result = await fetch(CX_SUPABASE_URL + '/auth/v1/token?grant_type=password', {
          method: 'POST',
          headers: { apikey: CX_SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        }).then(async function (response) {
          var body = await response.text();
          if (!response.ok) throw new Error(body || 'Login failed.');
          return JSON.parse(body);
        });
        cxSetCloudSession(result, remember);
        return result.user;
      }

      async function cxCloudSignUpPassword(email, password, displayName, remember) {
        var result = await fetch(CX_SUPABASE_URL + '/auth/v1/signup', {
          method: 'POST',
          headers: { apikey: CX_SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password, data: { display_name: displayName || '' } })
        }).then(async function (response) {
          var body = await response.text();
          if (!response.ok) throw new Error(body || 'Sign up failed.');
          return JSON.parse(body);
        });
        if (result.session) cxSetCloudSession(result.session, remember);
        return result.user;
      }

      async function cxEnsureAccessRow(user) {
        if (!user || !user.id) return null;
        var email = String(user.email || '').toLowerCase();
        var row = await cxCloudFetch('/rest/v1/crossify_user_access?user_id=eq.' + encodeURIComponent(user.id) + '&select=user_id,email,display_name,role,status,requested_at,reviewed_at&limit=1', { method: 'GET' })
          .then(function (rows) { return rows && rows[0] ? rows[0] : null; });
        if (row) return row;
        var status = email === CX_ADMIN_EMAIL ? 'approved' : 'pending';
        var role = email === CX_ADMIN_EMAIL ? 'admin' : 'user';
        var rows = await cxCloudFetch('/rest/v1/crossify_user_access?select=user_id,email,display_name,role,status,requested_at,reviewed_at', {
          method: 'POST',
          headers: { Prefer: 'return=representation' },
          body: JSON.stringify({ user_id: user.id, email: email, role: role, status: status })
        });
        return rows && rows[0] ? rows[0] : null;
      }

      function cxAdminEscape(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
        });
      }

      function cxAdminFormatDate(value) {
        if (!value) return '-';
        try {
          return new Date(value).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
        } catch (error) {
          return String(value);
        }
      }

      async function cxSendPasswordReset(email) {
        await fetch(CX_SUPABASE_URL + '/auth/v1/recover', {
          method: 'POST',
          headers: { apikey: CX_SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, gotrue_meta_security: {}, redirect_to: window.location.href.split('#')[0] })
        }).then(async function (response) {
          var body = await response.text();

      async function cxRefreshAuthGate() {
        if (cxAuthBypass()) { cxHideAuthGate(); return; }
        if (!cxCloudToken()) { cxRenderAuthGate(); return; }
        try {
          var user = await cxCloudGetUser();
          var access = await cxEnsureAccessRow(user);
          cxAuthCurrentAccess = access;
          if (access && access.status === 'approved') {
          cxHideAuthGate();
            cxRenderSessionButtons(access);
            return;
          }
          cxRenderAuthGate('<div class="cx-auth-status" data-type="warn">Your account is waiting for admin approval.<br>Admin: ' + CX_ADMIN_EMAIL + '</div>');
        } catch (error) {
          cxClearCloudSession();
          cxRenderAuthGate('<div class="cx-auth-status" data-type="error">' + cxAdminEscape(cxFriendlyAuthError(error)) + '</div>');
        }
      }

      async function cxAuthIsApproved() {
        if (cxAuthBypass()) return true;
        if (!cxCloudToken()) return false;
        var user = await cxCloudGetUser();
        var access = await cxEnsureAccessRow(user);
        cxAuthCurrentAccess = access;
        if (access && access.status === 'approved') cxRenderSessionButtons(access);
        return !!(access && access.status === 'approved');
      }

      async function cxWarmAuthStatus() {
        if (cxPasswordRecoveryActive) return;
        if (cxAuthBypass() || !cxCloudToken()) return;
        try {
          await cxAuthIsApproved();
        } catch (error) {
          console.warn('[CX Auth] warm status failed', error);
        }
      }

      function cxIsProtectedUseAction(target) {

        var el = target.closest('button, a, [role="button"], [role="menuitem"]');
        if (!el) return false;
        var text = (el.innerText || el.textContent || '').replace(/\s+/g, ' ').trim();
        return /^(เข้าใช้งานโปรแกรม|โหลดไฟล์ SPSS|Load SPSS File|Load SPSS|Change SPSS|Open SPSS File|Load Settings|Load Cloud Settings|โหลด Setting|โหลด Settings|Save Settings|Save Settings to Cloud|Save to Cloud|AutoSave Cloud|Run All|Run Table)$/i.test(text);
      }

      document.addEventListener('click', function (event) {

        if (cxAuthCurrentAccess && cxAuthCurrentAccess.status === 'approved') return;
        event.preventDefault();
        event.stopPropagation();
        if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();

          if (await cxAuthIsApproved()) {

      document.addEventListener('click', function (event) {
        var authButton = event.target && event.target.closest ? event.target.closest('[data-cx-auth]') : null;
        var approveButton = event.target && event.target.closest ? event.target.closest('[data-cx-approve]') : null;
        var adminClose = event.target && event.target.closest ? event.target.closest('[data-cx-admin-close]') : null;
        var adminRefresh = event.target && event.target.closest ? event.target.closest('[data-cx-admin-refresh]') : null;
        var adminStatus = event.target && event.target.closest ? event.target.closest('[data-cx-admin-status]') : null;
        var adminHistory = event.target && event.target.closest ? event.target.closest('[data-cx-admin-history]') : null;
        var adminHistoryClose = event.target && event.target.closest ? event.target.closest('[data-cx-admin-history-close]') : null;
        var adminDeleteWorkspace = event.target && event.target.closest ? event.target.closest('[data-cx-admin-delete-workspace]') : null;
        var adminDeleteVersion = event.target && event.target.closest ? event.target.closest('[data-cx-admin-delete-version]') : null;
        var adminReset = event.target && event.target.closest ? event.target.closest('[data-cx-admin-reset]') : null;
        if (!authButton && !approveButton && !adminClose && !adminRefresh && !adminStatus && !adminHistory && !adminHistoryClose && !adminDeleteWorkspace && !adminDeleteVersion && !adminReset) return;
        event.preventDefault();
        event.stopPropagation();
        if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
        Promise.resolve().then(async function () {
          if (adminClose) { var consoleEl = document.getElementById('cx-admin-console'); if (consoleEl) consoleEl.remove(); return; }
          if (adminRefresh) { await cxShowAdminPanel(); return; }
          if (adminHistoryClose) { var hp = document.getElementById('cx-admin-history-panel'); if (hp) hp.innerHTML = ''; return; }
          if (adminReset) {
            var resetEmail = adminReset.getAttribute('data-cx-admin-reset');
            if (!resetEmail) throw new Error('User email is missing.');
            await cxSendPasswordReset(resetEmail);
            cxCloudAlert('success', 'Reset Email Sent', 'Password reset email has been sent to ' + resetEmail + '.');
            return;
          }
          if (adminDeleteWorkspace) {
            var workspaceId = adminDeleteWorkspace.getAttribute('data-cx-admin-delete-workspace');
            var okDeleteWorkspace = window.__crossifyRuntime && window.__crossifyRuntime.confirm
              ? await window.__crossifyRuntime.confirm({ type: 'error', title: 'Delete Cloud Settings?', text: 'This will delete this workspace and every saved version. This cannot be undone.', confirmText: 'Delete', cancelText: 'Cancel' })
              : window.confirm('Delete this workspace and every saved version?');
            if (!okDeleteWorkspace) return;
            await cxDeleteAdminWorkspace(workspaceId);
            cxCloudAlert('success', 'Deleted', 'Cloud Settings workspace was deleted.');
            await cxShowAdminPanel();
            return;
          }
          if (adminDeleteVersion) {
            var versionId = adminDeleteVersion.getAttribute('data-cx-admin-delete-version');
            var historyWorkspaceId = adminDeleteVersion.getAttribute('data-cx-admin-history');
            var okDeleteVersion = window.__crossifyRuntime && window.__crossifyRuntime.confirm
              ? await window.__crossifyRuntime.confirm({ type: 'error', title: 'Delete Version?', text: 'This saved version will be removed permanently.', confirmText: 'Delete', cancelText: 'Cancel' })
              : window.confirm('Delete this saved version?');
            if (!okDeleteVersion) return;
            await cxDeleteAdminWorkspaceVersion(versionId);
            var afterDeleteVersions = await cxLoadAdminWorkspaceVersions(historyWorkspaceId);
            cxRenderAdminHistory(historyWorkspaceId, afterDeleteVersions || []);
            cxCloudAlert('success', 'Deleted', 'Saved version was deleted.');
            return;
          }
          if (adminHistory) {
            var selectedWorkspaceId = adminHistory.getAttribute('data-cx-admin-history');
            var versions = await cxLoadAdminWorkspaceVersions(selectedWorkspaceId);
            cxRenderAdminHistory(selectedWorkspaceId, versions || []);
            return;
          }
          if (adminStatus) {
            await cxUpdateAccessStatus(adminStatus.getAttribute('data-cx-admin-user'), adminStatus.getAttribute('data-cx-admin-status'));
            await cxShowAdminPanel();
            return;
          }
          if (approveButton) { await cxApproveAccess(approveButton.getAttribute('data-cx-approve')); await cxShowAdminPanel(); return; }
          var action = authButton.getAttribute('data-cx-auth');
          if (action === 'mode-login') { cxAuthMode = 'login'; cxRenderAuthGate(); return; }
          if (action === 'mode-signup') { cxAuthMode = 'signup'; cxRenderAuthGate(); return; }
          if (action === 'mode-forgot') { cxAuthMode = 'forgot'; cxRenderAuthGate(); return; }
          if (action === 'close') { cxHideAuthGate(); return; }
          if (action === 'refresh') { await cxRefreshAuthGate(); return; }
          if (action === 'admin-panel') { await cxShowAdminPanel(); return; }
          if (action === 'logout') { cxCloudSignOut(); return; }
          if (action === 'reset-password') {
            var resetPassword = document.getElementById('cx-reset-password');
            var resetConfirm = document.getElementById('cx-reset-password-confirm');
            var nextPassword = resetPassword ? resetPassword.value : '';
            var confirmPassword = resetConfirm ? resetConfirm.value : '';
            if (!nextPassword || nextPassword.length < 6) throw new Error('Password must be at least 6 characters.');
            if (nextPassword !== confirmPassword) throw new Error('Password confirmation does not match.');
            await cxUpdateRecoveryPassword(nextPassword);
            cxHideAuthGate();
            cxClearCloudSession(false);
            cxAuthCurrentAccess = null;
            cxPasswordRecoveryActive = false;
            cxAuthMode = 'login';
            cxRenderAuthGate('<div class="cx-auth-status">Password updated. Please login again with your new password.</div>');
            return;
          }
          var emailInput = document.getElementById('cx-auth-email');
          var passwordInput = document.getElementById('cx-auth-password');
          var nameInput = document.getElementById('cx-auth-name');
          var rememberInput = document.getElementById('cx-auth-remember');
          var email = emailInput ? emailInput.value.trim() : '';
          var password = passwordInput ? passwordInput.value : '';
          var remember = rememberInput ? rememberInput.checked : true;
          if (action === 'forgot-submit') {
            if (!email) throw new Error('Email is required.');
            await cxSendPasswordReset(email);
            cxAuthMode = 'login';
            cxRenderAuthGate('<div class="cx-auth-status">Reset link sent. Open your email, set a new password, then login again.</div>');
            return;
          }
          if (!email || !password) throw new Error('Email and password are required.');
          if (action === 'login') await cxCloudSignInPassword(email, password, remember);
          if (action === 'signup') {
            await cxCloudSignUpPassword(email, password, nameInput ? nameInput.value.trim() : '', remember);
            cxCloudAlert('success', 'Account requested', 'Account created. Your request will appear in Admin Console for approval.');
          }
          await cxRefreshAuthGate();
        }).catch(function (error) {
          cxRenderAuthGate('<div class="cx-auth-status" data-type="error">' + cxAdminEscape(cxFriendlyAuthError(error)) + '</div>');
        });
      }, true);

      function cxCollectDerivedDatasetState(dataset) {
        if (!dataset || !Array.isArray(dataset.variables) || !Array.isArray(dataset.cases)) return null;
        var derivedVars = dataset.variables.filter(function (variable) {
          return !!(variable && (variable._derived || variable._isDerivedGroupSynthetic));
        }).map(function (variable) {
          var copy = {};
          Object.keys(variable).forEach(function (key) {
            if (typeof variable[key] !== 'function') copy[key] = variable[key];
          });
          return copy;
        });
        if (!derivedVars.length) return null;
        var memberNames = {};
        derivedVars.forEach(function (variable) {
          if (variable && variable.name) memberNames[variable.name] = true;
          if (variable && Array.isArray(variable.memberNames)) {
            variable.memberNames.forEach(function (memberName) { if (memberName) memberNames[memberName] = true; });
          }
        });
        var values = {};
        Object.keys(memberNames).forEach(function (name) {
          values[name] = dataset.cases.map(function (row) { return row ? row[name] : undefined; });
        });
        return { variables: derivedVars, values: values };
      }

      function cxRestoreDerivedDatasetState(snapshot) {
        var derived = snapshot && snapshot.derivedDataset;
        if (!derived || !Array.isArray(derived.variables) || !derived.variables.length) return false;
        var hook = null;
        try { hook = (typeof window.__cxGetDatasetHook === 'function') ? window.__cxGetDatasetHook() : null; } catch (_hookErr) { hook = null; }
        var current = (hook && hook.data) || window.__cxDataset;
        if (!current || !Array.isArray(current.variables) || !Array.isArray(current.cases)) return false;
        var derivedNames = {};
        derived.variables.forEach(function (variable) {
          if (variable && variable.name) derivedNames[variable.name] = true;
          if (variable && Array.isArray(variable.memberNames)) variable.memberNames.forEach(function (memberName) { if (memberName) derivedNames[memberName] = true; });
        });
        var keptVars = current.variables.filter(function (variable) { return !(variable && variable.name && derivedNames[variable.name]); });
        var nextCases = current.cases.map(function (row, index) {
          var next = Object.assign({}, row);
          Object.keys(derived.values || {}).forEach(function (name) {
            var arr = derived.values[name];
            if (Array.isArray(arr) && index < arr.length) next[name] = arr[index];
          });
          return next;
        });
        var nextDataset = Object.assign({}, current, {
          variables: keptVars.concat(derived.variables),
          cases: nextCases
        });
        window.__cxDataset = nextDataset;
        if (hook && hook.dispatch) {
          try { hook.dispatch(function () { return nextDataset; }); } catch (_dispatchErr) { }
        }
        return true;
      }
      try {
        window.__cxCollectDerivedDatasetState = cxCollectDerivedDatasetState;
        window.__cxRestoreDerivedDatasetState = cxRestoreDerivedDatasetState;
      } catch (_cxDerivedCloudExposeErr) { }

      function cxCloudSnapshot() {
        if (typeof window.__cxBuildWorkspaceSnapshot !== 'function') return null;
        var snapshot = window.__cxBuildWorkspaceSnapshot();
        if (!snapshot || !snapshot.dataset) return null;
        var dataset = snapshot.dataset || {};
        return {
          version: 'runtime-cloud-v1',
          savedAt: new Date().toISOString(),
          dataset: {
            fileName: dataset.fileName || '',
            fileSize: dataset.fileSize || 0,
            casesCount: dataset.cases ? dataset.cases.length : 0,
            variablesCount: dataset.variables ? dataset.variables.length : 0
          },
          lightLoadMode: !!snapshot.lightLoadMode,
          customMrsets: snapshot.customMrsets || [],
          settings: snapshot.settings || {},
          tables: snapshot.tables || [],
          activeTableId: snapshot.activeTableId || null,
          activeTab: snapshot.activeTab || null,
          variableOverrides: snapshot.variableOverrides || {},
          derivedDataset: cxCollectDerivedDatasetState(dataset),
          banners: (typeof window.__cxGetBannerTemplates === 'function') ? window.__cxGetBannerTemplates() : [],
          currentSourceMappings: snapshot.currentSourceMappings || [],
          loadedSettingsName: snapshot.loadedSettingsName || null,
          folders: snapshot.folders || []
        };
      }

      function cxCloudWorkspacePatch(snapshot, user) {
        var dataset = snapshot.dataset || {};
        var fileName = dataset.fileName || 'Crossify Workspace';
        return {
          owner_id: user.id,
          name: String(fileName).replace(/\.sav$/i, ''),
          dataset_fingerprint: [
            dataset.fileName || '',
            dataset.fileSize || '',
            dataset.casesCount || '',
            dataset.variablesCount || ''
          ].join('|'),
          dataset_file_name: dataset.fileName || null,
          dataset_cases: dataset.casesCount || null,
          dataset_variables: dataset.variablesCount || null,
          updated_at: new Date().toISOString()
        };
      }

      /* ── No-login Cloud Settings ─────────────────────────────────────────────
         Store/read ONE settings row per dataset_file_name using only the anon key
         (cxCloudFetch sends no Bearer token when not signed in). Requires a Supabase
         table `crossify_settings (dataset_file_name text unique, settings jsonb,
         updated_at timestamptz)` with RLS granting the anon role select/insert/update. */
      /* Once the crossify_settings table is found missing, stop firing background
         (auto) requests so a not-yet-created table doesn't 404-spam the console on
         every edit. Manual Save still tries (so the user sees the setup error once). */
      var cxAnonTableMissing = false;
      function cxAnonIsTableMissing(e) {
        var m = (e && e.message ? e.message : String(e || '')) + '';
        return /crossify_settings|PGRST205|schema cache/i.test(m);
      }
      function cxAnonDsName() {
        try { var h = (typeof window.__cxGetDatasetHook === 'function') ? window.__cxGetDatasetHook() : null; if (h && h.data && h.data.fileName) return String(h.data.fileName); } catch (e) { }
        var d = window.__cxDataset; return d && d.fileName ? String(d.fileName) : '';
      }
      async function cxAnonSaveSettings(saveKind, quiet) {
        if (quiet && cxAnonTableMissing) return;          /* skip autosave once table is known missing */
        var name = cxAnonDsName();
        var snapshot = cxCloudSnapshot();
        if (!name || !snapshot) { if (!quiet) cxCloudAlert('info', 'No Workspace Loaded', 'โหลดไฟล์ SPSS และตั้งค่า Table ก่อน Save Settings ขึ้น Cloud'); return; }
        var hasDesignedTable = Array.isArray(snapshot.tables) && snapshot.tables.some(function (t) { return !!(t && (t.rowVar || t.colVar)); });
        if (!hasDesignedTable) { if (!quiet) cxCloudAlert('info', 'Nothing to Save', 'ตั้งค่า Top หรือ Side อย่างน้อย 1 ตัวก่อน Save Cloud Settings'); return; }
        try {
          await cxCloudFetch('/rest/v1/crossify_settings?on_conflict=dataset_file_name', {
            method: 'POST',
            headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
            body: JSON.stringify({ dataset_file_name: name, settings: snapshot, updated_at: new Date().toISOString() })
          });
        } catch (e) { if (cxAnonIsTableMissing(e)) cxAnonTableMissing = true; throw e; }
        try { cxUpdateCloudSaveStatus(saveKind || 'manual', 0); } catch (e) { }
        if (!quiet) cxCloudToast('Saved to Cloud', 'บันทึก Settings ของ "' + name + '" ขึ้น Cloud แล้ว');
      }
      async function cxAnonLoadSettings() {
        var name = cxAnonDsName();
        if (!name) { cxCloudAlert('info', 'Load SPSS First', 'โหลดไฟล์ SPSS ก่อน Load Cloud Settings'); return; }
        var rows = await cxCloudFetch('/rest/v1/crossify_settings?dataset_file_name=eq.' + encodeURIComponent(name) + '&select=settings&limit=1', { method: 'GET' });
        if (!rows || !rows.length || !rows[0].settings) { cxCloudAlert('info', 'No Cloud Settings', 'ยังไม่มี Settings ของไฟล์ "' + name + '" บน Cloud'); return; }
        var settings = rows[0].settings;
        if (typeof window.__cxApplyWorkspaceSettings !== 'function') { cxCloudAlert('error', 'Cloud Settings Error', 'Runtime restore bridge not ready. Refresh the page.'); return; }
        if (settings.banners && Array.isArray(settings.banners)) cxMergeBannerTemplates(settings.banners);
        cxRestoreDerivedDatasetState(settings);
        var result = window.__cxApplyWorkspaceSettings(settings);
        cxRestoreDerivedDatasetState(settings);
        if (!result || !result.ok) { cxCloudAlert('info', 'Load SPSS First', result && result.reason ? result.reason : 'โหลดไฟล์ SPSS ที่ตรงกันก่อน'); return; }
        cxCloudToast('Loaded Cloud Settings', 'คืน Settings ของ "' + name + '" แล้ว');
        setTimeout(function () { try { if (typeof window.__cxRunAllTablesNow === 'function') { window.__cxRunAllTablesNow(); return; } var b = Array.from(document.querySelectorAll('button')).find(function (x) { return /^Run All$/.test((x.textContent || '').replace(/\s+/g, ' ').trim()); }); if (b && !b.disabled) b.click(); } catch (e) { } }, 120);
      }

      async function cxCloudSave(saveKind, quiet) {
        if (!cxCloudToken()) { return cxAnonSaveSettings(saveKind, quiet); }
        var snapshot = cxCloudSnapshot();
        if (!snapshot) {
          if (!quiet) cxCloudAlert('info', 'No Workspace Loaded', 'โหลดไฟล์ SPSS และตั้งค่า Table ก่อน Save Settings ขึ้น Cloud');
          return;
        }
        var hasDesignedTable = Array.isArray(snapshot.tables) && snapshot.tables.some(function (table) {
          return !!(table && (table.rowVar || table.colVar));
        });
        if (!hasDesignedTable) {
          if (!quiet) cxCloudAlert('info', 'Nothing to Save', 'Set at least one Top or Side variable before saving Cloud Settings.');
          return;
        }
        var user = await cxCloudGetUser();
        if (!user || !user.id) throw new Error('Cannot read Cloud user session.');
        var workspaceId = localStorage.getItem(CX_WORKSPACE_KEY);
        var workspacePatch = cxCloudWorkspacePatch(snapshot, user);
        var workspaceRows;
        if (workspaceId) {
          workspaceRows = await cxCloudFetch('/rest/v1/crossify_workspaces?id=eq.' + encodeURIComponent(workspaceId) + '&select=id', {
            method: 'PATCH',
            headers: { Prefer: 'return=representation' },
            body: JSON.stringify(workspacePatch)
          });
        }
        if (!workspaceRows || !workspaceRows.length) {
          workspaceRows = await cxCloudFetch('/rest/v1/crossify_workspaces?select=id', {
            method: 'POST',
            headers: { Prefer: 'return=representation' },
            body: JSON.stringify(workspacePatch)
          });
        }
        workspaceId = workspaceRows && workspaceRows[0] && workspaceRows[0].id;
        if (!workspaceId) throw new Error('Cloud did not return a workspace id.');
        localStorage.setItem(CX_WORKSPACE_KEY, workspaceId);
        var versionStorageKey = 'crossify_cloud_workspace_version_' + workspaceId;
        var cachedVersion = Number(localStorage.getItem(versionStorageKey) || '0');
        var versionNo = cachedVersion > 0 ? cachedVersion + 1 : 1;
        if (cachedVersion <= 0 || saveKind !== 'autosave') {
          var latest = await cxCloudFetch('/rest/v1/crossify_workspace_versions?workspace_id=eq.' + encodeURIComponent(workspaceId) + '&select=version_no&order=version_no.desc&limit=1', {
            method: 'GET'
          });
          versionNo = latest && latest[0] && latest[0].version_no ? latest[0].version_no + 1 : 1;
        }
        await cxCloudFetch('/rest/v1/crossify_workspace_versions', {
          method: 'POST',
          headers: { Prefer: 'return=minimal' },
          body: JSON.stringify({
            workspace_id: workspaceId,
            version_no: versionNo,
            save_kind: saveKind || 'manual',
            settings: snapshot
          })
        });
        localStorage.setItem(versionStorageKey, String(versionNo));
        cxUpdateCloudSaveStatus(saveKind || 'manual', versionNo);
        if (!quiet) cxCloudAlert('success', 'Saved to Cloud', 'บันทึก Settings ขึ้น Cloud แล้ว\nVersion ' + versionNo);
        return versionNo;
      }

      async function cxCloudLoadLatest() {
        if (!cxCloudToken()) { return cxAnonLoadSettings(); }
        var workspaceId = localStorage.getItem(CX_WORKSPACE_KEY);
        var workspaces = workspaceId
          ? await cxCloudFetch('/rest/v1/crossify_workspaces?id=eq.' + encodeURIComponent(workspaceId) + '&select=id,name,updated_at&limit=1', { method: 'GET' })
          : await cxCloudFetch('/rest/v1/crossify_workspaces?select=id,name,updated_at&order=updated_at.desc&limit=1', { method: 'GET' });
        if (!workspaces || !workspaces.length) {
          cxCloudAlert('info', 'No Cloud Settings', 'No saved Cloud Settings found for this account.');
          return;
        }
        workspaceId = workspaces[0].id;
        localStorage.setItem(CX_WORKSPACE_KEY, workspaceId);
        var versions = await cxCloudFetch('/rest/v1/crossify_workspace_versions?workspace_id=eq.' + encodeURIComponent(workspaceId) + '&select=id,version_no,settings,created_at,save_kind&order=version_no.desc&limit=1', { method: 'GET' });
        var selectedVersion = versions && versions[0];
        if (!selectedVersion || !selectedVersion.settings) {
          cxCloudAlert('info', 'No Cloud Settings', 'This workspace has no saved versions yet.');
          return;
        }
        localStorage.setItem('crossify_cloud_workspace_version_' + workspaceId, String(selectedVersion.version_no || 0));
        if (typeof window.__cxApplyWorkspaceSettings !== 'function') {
          cxCloudAlert('error', 'Cloud Settings Error', 'Runtime restore bridge is not ready. Please refresh the page.');
          return;
        }
        if (selectedVersion.settings && Array.isArray(selectedVersion.settings.banners) && typeof window.__cxSetBannerTemplates === 'function') {
          cxMergeBannerTemplates(selectedVersion.settings.banners);
        }
        cxRestoreDerivedDatasetState(selectedVersion.settings);
        var result = window.__cxApplyWorkspaceSettings(selectedVersion.settings);
        cxRestoreDerivedDatasetState(selectedVersion.settings);
        if (!result || !result.ok) {
          cxCloudAlert('info', 'Load SPSS First', result && result.reason ? result.reason : 'Load the matching SPSS file before loading Cloud Settings.');
          return;
        }
        cxCloudToast('Loaded Cloud Settings', 'Restored ' + (workspaces[0].name || 'Cloud Settings') + ' version ' + selectedVersion.version_no + '.');
        setTimeout(function () {
          try {
            if (typeof window.__cxRunAllTablesNow === 'function') {
              window.__cxRunAllTablesNow();
              return;
            }
            var buttons = Array.from(document.querySelectorAll('button'));
            var runAll = buttons.find(function (btn) {
              var text = (btn.textContent || '').replace(/\s+/g, ' ').trim();
              return /^Run All$/i.test(text) || text === 'Run All';
            });
            if (runAll && !runAll.disabled) runAll.click();
          } catch (runErr) {
            console.warn('[CX Cloud Settings] auto refresh after load failed', runErr);
          }
        }, 120);
      }

      function cxCloudAutosaveEnabled() {
        return localStorage.getItem(CX_AUTOSAVE_KEY) === 'on';
      }

      function cxCloudFormatTime(date) {
        try {
          return (date || new Date()).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
        } catch (_error) {
          return '';
        }
      }

      function cxRenderCloudSaveStatus() {
        var existing = document.getElementById('cx-cloud-save-status');
        if (window.__CX_DESKTOP_APP === true) {
          if (existing) existing.remove();
          return null;
        }
        /* Show the status badge when signed in OR when no-login AutoSave is enabled
           (otherwise the user gets no feedback that anon autosave is happening). */
        if (!cxCloudToken() && !cxCloudAutosaveEnabled()) {
          if (existing) existing.remove();
          return null;
        }
        if (existing) return existing;
        var status = document.createElement('div');
        status.id = 'cx-cloud-save-status';
        status.textContent = 'AutoSave Cloud: On';
        status.style.cssText = 'position:fixed;right:350px;top:18px;z-index:2147481200;display:flex;align-items:center;gap:7px;border:1px solid rgba(191,219,254,.55);border-radius:999px;background:rgba(255,255,255,.13);color:#dbeafe;padding:7px 11px;font:800 12px Inter,"Noto Sans Thai",system-ui;box-shadow:0 8px 20px rgba(15,23,42,.12);backdrop-filter:blur(8px);pointer-events:none';
        document.body.appendChild(status);
        return status;
      }

      function cxUpdateCloudSaveStatus(saveKind, versionNo) {
        var status = cxRenderCloudSaveStatus();
        if (!status) return;
        var label = saveKind === 'autosave' ? 'Auto saved' : 'Saved';
        status.textContent = label + ' ' + cxCloudFormatTime(new Date()) + (versionNo ? ' · v' + versionNo : '') + ' · Cloud';
      }

      function cxCloudToast(title, message) {
        if (window.__crossifyRuntime && typeof window.__crossifyRuntime.toast === 'function') {
          window.__crossifyRuntime.toast({ title: title || 'Cloud', text: message || '', timer: 2400 });
          return;
        }
        cxCloudAlert('success', title || 'Cloud', message || '');
      }

      /* Restoring a per-dataset snapshot must not WIPE the global banner library —
         merge: snapshot banners win on id, banners not in the snapshot are kept. */
      function cxMergeBannerTemplates(snapshotBanners) {
        try {
          if (!Array.isArray(snapshotBanners) || typeof window.__cxGetBannerTemplates !== 'function' || typeof window.__cxSetBannerTemplates !== 'function') return;
          var existing = window.__cxGetBannerTemplates() || [];
          var byId = {};
          snapshotBanners.forEach(function (b) { if (b && b.id) byId[b.id] = true; });
          var kept = existing.filter(function (b) { return b && b.id && !byId[b.id]; });
          window.__cxSetBannerTemplates(snapshotBanners.concat(kept));
        } catch (_mbErr) { }
      }

      var cxCloudAutosaveFirstReq = 0;
      function cxCloudScheduleAutosave() {
        if (window.__CX_DESKTOP_APP === true) return;
        if (!cxCloudAutosaveEnabled()) return;
        /* Anti-starvation: every call resets the 3s debounce, so sustained DOM churn
           (observer storms during long runs) could postpone autosave forever. Once a save
           has been pending > 15s, stop resetting and let the armed timer fire. */
        var nowTs = Date.now();
        if (!cxCloudAutosaveFirstReq) cxCloudAutosaveFirstReq = nowTs;
        else if (cxCloudAutosaveTimer && nowTs - cxCloudAutosaveFirstReq > 15000) return;
        clearTimeout(cxCloudAutosaveTimer);
        cxCloudAutosaveTimer = setTimeout(async function () {
          cxCloudAutosaveFirstReq = 0;
          if (cxCloudAutosaveBusy) { cxCloudScheduleAutosave(); return; } /* don't drop the last edits */
          if (!cxCloudSnapshot()) return;
          cxCloudAutosaveBusy = true;
          try {
            await cxCloudSave('autosave', true);
          } catch (error) {
            console.warn('[CX Cloud Settings] autosave failed', error);
          } finally {
            cxCloudAutosaveBusy = false;
          }
        }, 3000);
      }

      function cxCloudRequestAutosaveNow() {
        if (window.__CX_DESKTOP_APP === true) {
          if (typeof window.cxDesktopSaveProject === 'function') {
            return window.cxDesktopSaveProject().catch(function (error) {
              if (error && error.name === 'AbortError') return;
              throw error;
            });
          }
          return Promise.resolve();
        }
        if (!cxCloudAutosaveEnabled()) return Promise.resolve();
        clearTimeout(cxCloudAutosaveTimer);
        cxCloudAutosaveTimer = setTimeout(async function () {
          if (cxCloudAutosaveBusy || !cxCloudSnapshot()) return;
          cxCloudAutosaveBusy = true;
          try {
            await cxCloudSave('autosave', true);
          } catch (error) {
            console.warn('[CX Cloud Settings] autosave failed', error);
          } finally {
            cxCloudAutosaveBusy = false;
          }
        }, 650);
        return Promise.resolve();
      }

      function cxCloudToggleAutosave() {
        var next = cxCloudAutosaveEnabled() ? 'off' : 'on';
        localStorage.setItem(CX_AUTOSAVE_KEY, next);
        cxRefreshCloudMenus();
        cxCloudAlert('success', next === 'on' ? 'AutoSave On' : 'AutoSave Off', next === 'on' ? 'Crossify จะ AutoSave Settings ขึ้น Cloud เมื่อมีการเปลี่ยนแปลง' : 'ปิด AutoSave Cloud แล้ว');
        if (next === 'on') cxCloudScheduleAutosave();
      }

            /* a table with no resolvable SIDE can never produce rows — skip + report
               (TOP-only would silently render nothing) */
            skippedTables.push({ name: t.name, description: t.description, reason: skipped.length ? 'variables not in SAV: ' + skipped.join(', ') : 'no mappable axis variables' });
            return;
          }
          var filter = null, filterSkipped = null;
          if (t.filters.length) {
            var exprs = t.filters.map(function (f) { return f.expression; }).join(' And ');
            var res = mapMtdFilter(exprs, index);
            if (res.spec) { filter = res.spec; filtersApplied++; }
            else { filterSkipped = res.reason; filtersSkipped++; }
          }
          if (!skipped.length && !filterSkipped) fullyMapped++; else partiallyMapped++;
          tables.push({
            description: (t.description || t.name) + (filterSkipped ? ' [NO FILTER]' : ''),
            /* ' ++ ' = stacked (same level); ' || ' would NEST (bundle ct()/wf()/kg() format) */
            rowVar: sideVars.join(' ++ '),
            colVar: topVars.join(' ++ '),
            filter: filter,
            filterSkipped: filterSkipped,
            skippedVars: skipped
          });
          if (!sig && t.testColumns) {
            var letters = mapTestColumns(t.testColumns);
            if (letters) sig = { enabled: true, level: t.sigAlpha === 10 ? 90 : t.sigAlpha === 1 ? 99 : 95, sigLetters: letters, minBase: t.sigMinBase || 0 };
          }
        });

        return {
          tables: tables, overrides: overrides, sig: sig,
          report: {
            totalTables: parsed.tables.length,
            fullyMapped: fullyMapped, partiallyMapped: partiallyMapped,
            netsApplied: netsApplied, filtersApplied: filtersApplied, filtersSkipped: filtersSkipped,
            varsMissing: Object.keys(varsMissing), skippedTables: skippedTables
          }
        };
      }

      /* ── Apply to the running app ── */
      function tablesHook() {
        try { return typeof window.__cxResolveLiveTablesHook === 'function' ? window.__cxResolveLiveTablesHook() : null; } catch (_e) { return null; }
      }
      function cxMtdApply(mapped, mode) {
        /* 1) Nets/Combines → variable overrides (same write the Apply-Net feature uses) */
        var ov = (window.__cxVariableOverrides && typeof window.__cxVariableOverrides === 'object') ? window.__cxVariableOverrides : {};
        Object.keys(mapped.overrides).forEach(function (name) {
          var base = (ov[name] && typeof ov[name] === 'object') ? ov[name] : {};
          var groups = mapped.overrides[name].map(function (g) { return { id: g.id, name: g.name, members: g.members.slice() }; });
          /* never clobber USER-created nets: only write when the variable has no groups yet
             or its groups came from a previous mtd import (ids start with "mtdnet-") */
          var existingGroups = Array.isArray(base.groups) ? base.groups : [];
          var userMade = existingGroups.some(function (g) { return g && typeof g.id === 'string' && g.id.indexOf('mtdnet-') !== 0; });
          if (userMade) return;
          base.groups = groups;
          base.netGroups = groups.map(function (g) { return { id: g.id, name: g.name, members: g.members.slice() }; });
          /* the option/run pipeline reads override.weights[code] UNGUARDED (and labels/order
             elsewhere) — a partial override crashes every run of that variable */
          if (!base.weights || typeof base.weights !== 'object') base.weights = {};
          if (!base.labels || typeof base.labels !== 'object') base.labels = {};
          ov[name] = base;
        });
        window.__cxVariableOverrides = ov;
        /* 2) Sig settings */
        if (mapped.sig && typeof window.__cxSaveSigSettings === 'function') {
          window.__cxSaveSigSettings({ enabled: true, level: mapped.sig.level, sigLetters: mapped.sig.sigLetters, minBase: mapped.sig.minBase });
        }
        /* 3) Tables → SAVED BANNERS + auto "Load & Run Selected".
           Rationale: importing through the banner pipeline reuses the existing,
           production-proven Load & Run path (the same button the user already uses),
           gives persistence for free (all imported tables stay in Saved Banners for
           re-running/batch-export), and avoids dispatching React state from outside an
           event (which can silently no-op). */
        var runId = 'cx-mtd-' + Date.now().toString(36);
        var getB = window.__cxGetBannerTemplates;
        var setB = window.__cxSetBannerTemplates;
        var loadSel = window.__cxBannerLoadSelectedForTest;
        if (typeof getB !== 'function' || typeof setB !== 'function' || typeof loadSel !== 'function') {
          return Promise.resolve(false);
        }
        var now = new Date().toISOString();
        var existing = (mode === 'append') ? (getB() || []) : (getB() || []).filter(function (b) {
          return !(b && typeof b.id === 'string' && b.id.indexOf('cx-mtd-') === 0);
        });
        var fresh = mapped.tables.map(function (t, i) {
          return {
            id: runId + '-' + i,
            name: t.description,
            createdAt: now,
            updatedAt: now,
            table: {
              name: t.description,
              description: t.description,
              rowVar: t.rowVar,
              colVar: t.colVar,
              /* the Filter tab reads filter.description unconditionally — never null */
              filter: t.filter || { description: '', rootJoin: 'all', groups: [] },
              result: null
            }
          };
        });
        setB(existing.concat(fresh));
        /* Load the imported banners as tables — same dispatch shape as the banner module's
           loadSelected, but WITHOUT its immediate runAllSoon (which would click Run All
           before the new tables commit and run the old empty table instead). Our gated
           clicks below run only after the imported tables are visible. */
        try {
          var hook = tablesHook();
          var dispatch = hook && hook.queue && (hook.queue.__cxOrigDispatch || hook.queue.dispatch);
          if (typeof dispatch === 'function') {
            dispatch(function (prev) {
              var seed = (Array.isArray(prev) && prev[0]) ? prev[0] : {};
              var made = fresh.map(function (b, index) {
                return Object.assign({}, seed, JSON.parse(JSON.stringify(b.table)), {
                  id: 'cx-banner-table-' + b.id + '-' + index,
                  name: b.name,
                  description: b.name,
                  result: null
                });
              });
              /* honor append mode — replacing here wiped the user's current tables */
              if (mode === 'append' && Array.isArray(prev)) return prev.concat(made);
              return made;
            });
          }
        } catch (_lsErr) { }
        /* loadSelected's own flush is a Run All click, which is DISABLED while the current
           table is empty — guarantee a flush with a native click on an always-enabled tab
           button so the dispatched tables state commits. */
        setTimeout(function () {
          try {
            var tab = Array.from(document.querySelectorAll('button')).find(function (b) {
              return (b.textContent || '').trim() === 'Design' && !b.disabled;
            });
            if (tab) tab.click();
          } catch (_fErr) { }
        }, 300);
        setTimeout(function () {
          try {
            /* Only auto-run once the imported tables have actually committed to the UI
               (clicking Run All against the old empty table throws in the run pipeline). */
            var firstDesc = mapped.tables[0] && mapped.tables[0].description;
            if (!firstDesc || !document.body || document.body.innerText.indexOf(firstDesc) < 0) return;
            var runBtn = Array.from(document.querySelectorAll('button')).find(function (b) {
              return (b.textContent || '').replace(/\s+/g, ' ').trim() === 'Run All' && !b.disabled;
            });
            if (runBtn) runBtn.click();
          } catch (_rErr) { }
        }, 900);
        return Promise.resolve(true);
      }

      function fmtReport(report, applied) {
        var lines = [];
        lines.push((applied ? 'นำเข้าแล้ว ' : 'พร้อมนำเข้า ') + report.totalTables + ' ตารางจาก Reporter');
        lines.push('• สร้างตาราง: ' + (report.totalTables - report.skippedTables.length) + ' (ครบสมบูรณ์ ' + report.fullyMapped + ', บางส่วน ' + report.partiallyMapped + ')');
        lines.push('• Net/Combine ที่จับให้: ' + report.netsApplied + ' กลุ่ม');
        lines.push('• Filter: ใส่ให้ ' + report.filtersApplied + ' ตาราง' + (report.filtersSkipped ? ', แปลงไม่ได้ ' + report.filtersSkipped + ' ตาราง (ติดป้าย [NO FILTER])' : ''));
        if (report.skippedTables.length) {
          lines.push('• ข้าม ' + report.skippedTables.length + ' ตาราง (ตัวแปรไม่อยู่ในไฟล์ SAV เช่น grid/banner เฉพาะของ Reporter):');
          report.skippedTables.slice(0, 8).forEach(function (s) { lines.push('   - ' + (s.description || s.name)); });
          if (report.skippedTables.length > 8) lines.push('   ... และอีก ' + (report.skippedTables.length - 8) + ' ตาราง');
        }
        return lines.join('\n');
      }

      function handleMtdFile(file) {
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var ds = window.__cxDataset;
            if (!ds || !Array.isArray(ds.variables) || !ds.variables.length) {
              cxRuntimeAlert('กรุณาโหลดไฟล์ SPSS (.sav) ก่อน แล้วค่อยนำเข้า .mtd');
              return;
            }
            var parsed = cxMtdParse(String(reader.result || ''));
            if (!parsed.tables.length) { cxRuntimeAlert('ไม่พบตารางในไฟล์ .mtd นี้'); return; }
            var mapped = cxMtdMap(parsed, ds.variables);
            var msg = fmtReport(mapped.report, false) + '\n\nต้องการแทนที่รายการตารางปัจจุบัน หรือเพิ่มต่อท้าย?';
            var doApply = function (mode) {
              Promise.resolve(cxMtdApply(mapped, mode)).then(function (ok) {
                if (ok) cxRuntimeAlert(fmtReport(mapped.report, true) + '\n\nกด Run All เพื่อรันทุกตาราง');
                else cxRuntimeAlert('นำเข้าไม่สำเร็จ: สถานะตารางของแอปยังไม่พร้อม ลองอีกครั้ง');
              });
            };
            if (window.__crossifyRuntime && typeof window.__crossifyRuntime.confirm === 'function') {
              window.__crossifyRuntime.confirm({ title: 'Import Reporter (.mtd)', text: msg, confirmText: 'แทนที่ทั้งหมด', cancelText: 'เพิ่มต่อท้าย' })
                .then(function (res) {
                  if (res === null || res === undefined) return; /* X/dismiss = abort, not append */
                  doApply(res ? 'replace' : 'append');
                });
            } else {
              doApply(window.confirm(msg + '\n\nOK = แทนที่, Cancel = เพิ่มต่อท้าย') ? 'replace' : 'append');
            }
          } catch (err) {
            console.error('[MTD] import failed:', err);
            try { cxRuntimeAlert('นำเข้า .mtd ไม่สำเร็จ: ' + (err && err.message ? err.message : String(err))); } catch (_a) { }
          }
        };
        reader.readAsText(file, 'utf-8');
      }

      /* hidden file input */
      var fileInput = null;
      function ensureFileInput() {
        if (fileInput) return fileInput;
        fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = '.mtd,.xml';
        fileInput.style.display = 'none';
        fileInput.addEventListener('change', function () {
          if (fileInput.files && fileInput.files[0]) handleMtdFile(fileInput.files[0]);
          fileInput.value = '';
        });
        (document.body || document.documentElement).appendChild(fileInput);
        return fileInput;
      }

      /* menu injection — idempotent, mirrors the cloud-menu approach (only insert when absent) */
      function injectMenuItem() {
        var menus = Array.from(document.querySelectorAll('div.absolute, div[role="menu"]'));
        menus.forEach(function (menu) {
          if (menu.querySelector('#cx-mtd-import-item')) return;
          var hasCloudItems = !!menu.querySelector('[data-cx-cloud], #cx-cloud-save-settings-item');
          var text = (menu.textContent || '');
          var looksWorkspace = hasCloudItems || (text.indexOf('Load SPSS') >= 0 || text.indexOf('Save Cloud Settings') >= 0);
          if (!looksWorkspace) return;
          var btn = document.createElement('button');
          btn.id = 'cx-mtd-import-item';
          btn.type = 'button';
          btn.className = 'cx-cloud-item';
          btn.textContent = 'Import Reporter (.mtd)';
          btn.addEventListener('click', function (e) {
            e.preventDefault(); e.stopPropagation();
            ensureFileInput().click();
          });
          menu.appendChild(btn);
        });
      }
      var _mtdObs = new MutationObserver(function () { try { injectMenuItem(); } catch (_e) { } });
      function startObs() {
        try { _mtdObs.observe(document.body, { childList: true, subtree: true }); injectMenuItem(); } catch (_e) { }
      }
      if (document.body) startObs(); else document.addEventListener('DOMContentLoaded', startObs);

      /* heal banners saved by the first release (filter:null crashes the Filter tab) */
      setTimeout(function () {
        try {
          if (typeof window.__cxGetBannerTemplates !== 'function' || typeof window.__cxSetBannerTemplates !== 'function') return;
          var ovh = window.__cxVariableOverrides;
          if (ovh && typeof ovh === 'object') {
            Object.keys(ovh).forEach(function (k) {
              var o = ovh[k];
              if (o && typeof o === 'object' && (Array.isArray(o.groups) || Array.isArray(o.netGroups))) {
                if (!o.weights || typeof o.weights !== 'object') o.weights = {};
                if (!o.labels || typeof o.labels !== 'object') o.labels = {};
              }
            });
          }
          var all = window.__cxGetBannerTemplates() || [];
          var changed = false;
          all.forEach(function (b) {
            if (b && b.table && b.table.filter == null) {
              b.table.filter = { description: '', rootJoin: 'all', groups: [] };
              changed = true;
            }
            /* first-release mtd banners lacked table.name → tables list showed "Table1" */
            if (b && b.table && typeof b.id === 'string' && b.id.indexOf('cx-mtd') === 0 && b.name && !b.table.name) {
              b.table.name = b.name;
              changed = true;
            }
          });
          if (changed) window.__cxSetBannerTemplates(all);
        } catch (_healErr) { }
      }, 1200);

      /* test hooks */
      window.__cxMtdParse = cxMtdParse;
      window.__cxMtdImportForTest = function (xmlText, mode) {
        var ds = window.__cxDataset;
        var parsed = cxMtdParse(String(xmlText));
        var mapped = cxMtdMap(parsed, ds && ds.variables ? ds.variables : []);
        return Promise.resolve(cxMtdApply(mapped, mode || 'replace')).then(function (ok) {
          return { ok: ok, report: mapped.report, overrides: mapped.overrides, sig: mapped.sig, tables: mapped.tables.length };
        });
      };
    })();
  </script>
  <!-- Desktop download button removed — full web app only. -->
