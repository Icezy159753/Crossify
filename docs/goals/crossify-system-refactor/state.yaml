# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Crossify System Refactor"
  slug: "crossify-system-refactor"
  kind: specific
  tranche: "Audit and refactor Crossify in safe verified slices while preserving behavior and fixing concrete discovered bugs."
  status: active
  intake:
    original_request: "ตรวจสอบและ Refactor code ทั้งระบบให้ดูแลง่ายขึ้นและไม่พังทุกอย่างต้องใช้งานได้เหมือนเดิม และแก้ Bug ทุกฟังชั่นที่มี ถ้าเจอ Bug หลักๆคือ Refactor Code"
    interpreted_outcome: "Crossify becomes easier to maintain through verified incremental refactors, with concrete discovered bugs fixed and existing workflows preserved."
    input_shape: specific
    audience: "Crossify maintainer and SPSS crosstab users"
    authority: approved
    proof_type: test
    completion_proof: "Receipts show audited risks, implemented refactor slices, fixed bugs, and passing verification for affected behavior."
    likely_misfire: "A broad rewrite breaks behavior or creates churn without improving maintainability."
    blind_spots_considered:
      - "Existing dirty worktree includes user or generated changes."
      - "src/App.tsx is very large and disables static checks."
      - "Generated public assets and local data files should not be cleaned up unless explicitly selected."
      - "Some bugs may only appear with real SAV workflows and cannot be claimed fixed without reproduction."
    existing_plan_facts:
      - "GoalBuddy is installed and doctor-ready."
      - "Prior baseline passed npm test, npm run build, and npm run lint."
      - "Local Vite server is running on port 5173."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true

agents:
  scout: installed
  worker: installed
  judge: installed

active_task: T999

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: high
    objective: "Audit the codebase and dirty diff to identify maintainability hotspots, concrete bug risks, coverage gaps, and the safest first refactor slices."
    inputs:
      - "AGENTS.md"
      - "package.json"
      - "vite.config.ts"
      - "src/App.tsx"
      - "src/components"
      - "src/hooks"
      - "src/lib"
      - "src/types"
      - "existing tests"
      - "git status and diffs"
    constraints:
      - "Read-only."
      - "Do not edit implementation files."
      - "Preserve existing user changes."
      - "Ground findings in file paths and verification evidence."
    expected_output:
      - "Architecture map"
      - "Maintainability hotspots"
      - "Concrete bug risks"
      - "Coverage gaps"
      - "Ranked safe refactor candidates"
      - "Recommended first Worker task"
    receipt:
      result: done
      summary: "Audited baseline health, file sizes, dirty diff, and maintainability risks."
      evidence:
        - "npm test passed: 19 files, 377 tests."
        - "npm run lint passed."
        - "npm run build passed."
        - "Largest source file is src/App.tsx at about 172 KB."
        - "src/App.tsx has eslint-disable and ts-nocheck at lines 1-2."
        - "loadWorkspaceSnapshot exists in src/App.tsx but has no call site."
        - "Existing dirty worktree includes app source, generated assets, local docs, and data files."
      hotspots:
        - "src/App.tsx centralizes UI state, persistence helpers, file loading, table operations, variable editor, run/export logic, and JSX."
        - "Workspace snapshot persistence is embedded in App, lacks unit tests, and is only half wired."
        - "Build config cleanup from the prior GoalBuddy readiness slice is already verified."
      bug_risks:
        - "Snapshot restore is likely incomplete because saveWorkspaceSnapshot exists but loadWorkspaceSnapshot is unused."
        - "App.tsx static checking is disabled, so future refactors need tests around extracted helpers."
      recommended_first_slice: "Extract workspace snapshot IndexedDB helpers into src/lib/workspaceSnapshot.ts with fake-indexeddb tests, then update App imports without changing runtime behavior."
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Choose the first safe refactor/bug-fix Worker task from Scout findings."
    inputs:
      - "T001 receipt"
      - "Current dirty diff"
      - "Goal constraints"
    constraints:
      - "Do not implement."
      - "Choose a small reversible slice."
      - "Avoid touching generated assets."
      - "Require verification commands."
    expected_output:
      - "Decision"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify"
      - "stop_if"
    receipt:
      result: done
      decision: "Proceed with a small behavior-preserving extraction of workspace snapshot storage."
      rationale:
        - "It reduces App.tsx responsibility without changing UI behavior."
        - "It adds missing test coverage around IndexedDB snapshot persistence."
        - "It sets up the next bug-fix slice for actual restore wiring."
      worker_task: "Create src/lib/workspaceSnapshot.ts and src/lib/workspaceSnapshot.test.ts, replace local App.tsx snapshot helpers with imports, and verify tests/build/lint."
      allowed_files:
